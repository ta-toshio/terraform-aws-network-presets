services:
  terraform:
    image: hashicorp/terraform:1.6.2
    volumes:
      - ./setup:/tf/setup
      - ./deploy:/tf/deploy
      - ./modules:/tf/modules # モジュールディレクトリをマウント
    working_dir: /tf
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_DEFAULT_REGION=ap-northeast-1
      - TF_WORKSPACE=${TF_WORKSPACE}
      - TF_VAR_app_env=${APP_ENV}
      - TF_VAR_project=${PROJECT}
      - TF_VAR_base_domain_name=${BASE_DOMAIN_NAME}
      - TF_VAR_amplify_oauth_token=${AMPLIFY_OAUTH_TOKEN}
      - TF_VAR_ecr_repo_web_uri=${ECR_REPO_WEB_URI}
      - TF_VAR_ecr_repo_cli_uri=${ECR_REPO_CLI_URI}
      - TF_VAR_db_type=${DB_TYPE}
      - TF_VAR_db_name=${DB_NAME}
      - TF_VAR_db_username=${DB_USER}
      - TF_VAR_db_password=${DB_PASSWORD}
      - TF_VAR_db_port=${DB_PORT}
      - TF_VAR_alert_email=${ALERT_EMAIL}
